<section class="space-y-4">
  <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-[0_1px_2px_rgba(15,23,42,0.04)]">
		<div class="mb-4 flex items-center justify-between">
      <h3 class="text-sm font-semibold text-slate-700">Detalle del Servicio</h3>
		</div>
    <form class="space-y-4">
			<div class="grid grid-cols-1 gap-4 lg:grid-cols-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700">Nro de Solicitud <span class="text-rose-500">*</span></label>
          <input type="text" class="rounded-md border border-slate-200 px-3 py-1.5 text-sm w-full" placeholder="Nro de Solicitud" value="{{numeroSolicitud()}}"  />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700">Fecha del Servicio <span class="text-rose-500">*</span></label>
          <input type="date" class="rounded-md border border-slate-200 px-3 py-1.5 text-sm w-full" placeholder="Fecha del Servicio" value="{{fechaServicio()}}" />
        </div>
      </div>
      <hr class="border-gray-300"/>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50" [class.bg-indigo-600]="mostrarLogistica()" [class.text-white]="mostrarLogistica()" [class.shadow-sm]="mostrarLogistica()" (click)="alternarSeccion('logistica')">
          Logística del Servicio
        </button>
        <button type="button" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50" [class.bg-indigo-600]="mostrarSolicitante()" [class.text-white]="mostrarSolicitante()" [class.shadow-sm]="mostrarSolicitante()" (click)="alternarSeccion('solicitante')">
          Datos del Solicitante
        </button>
      </div>

      <div *ngIf="mostrarLogistica()">
        <div class="mt-4">
          <div class="mb-4 flex items-center justify-between">
            <h3 class="text-sm font-semibold text-slate-700">Logistica del Servicio: {{ detalleDelServicio() }}</h3>
          </div>
        </div>
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">{{ titleP1()}} <span class="text-rose-500">*</span></label>
            <select
						class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
					>
						<option value="default">Seleccionar...</option>
						<option value="lima">Lima</option>
						<option value="callao">Callao</option>
						<option value="ate">Ate</option>
						<option value="chorrillos">Chorrillos</option>
						<option value="lurin">Lurin</option>
					</select>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">{{ titleAlmacenP1() }}</label>
            <select
						class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
					>
						<option value="default">Seleccionar...</option>
						<option value="dpwc">DPW-Callao</option>
						<option value="ransa">Ransa</option>
						<option value="tpp">TPP</option>
						<option value="unimar">Unimar</option>
						<option value="contrans">Contrans</option>
              <option value="rfs">RFS</option>
              <option value="otro">Otro</option>
					</select>
          </div>
          <div><!--Esta seccion cambia si es carga suelta-->
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Peso Bruto de la Carga (kg) <span class="text-rose-500">*</span></label>
            <input type="number" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-full" placeholder="0.00" />
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Flete Ofrecido (S/.) <span class="text-rose-500">*</span></label>
            <input type="number" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-full" placeholder="0.00" />
          </div>
        </div>
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">{{ titleP2() }} <span class="text-rose-500">*</span></label>
            <select
						class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
					>
						<option value="default">Seleccionar...</option>
						<option value="lima">Lima</option>
						<option value="callao">Callao</option>
						<option value="ate">Ate</option>
						<option value="chorrillos">Chorrillos</option>
						<option value="lurin">Lurin</option>
					</select>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">{{ titleAlmacenP2() }}</label>
            <select
						class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
					>
						<option value="default">Seleccionar...</option>
						<option value="dpwc">DPW-Callao</option>
						<option value="ransa">Ransa</option>
						<option value="tpp">TPP</option>
						<option value="unimar">Unimar</option>
						<option value="contrans">Contrans</option>
              <option value="rfs">RFS</option>
              <option value="otro">Otro</option>
					</select>
          </div>
          <div><!--Esta seccion cambia si es carga suelta-->
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Volumen de la Carga (m3) <span class="text-rose-500">*</span></label>
            <input type="number" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-full" placeholder="0.00" />
          </div>
          <div><!--Esta seccion cambia si es carga suelta-->
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Cantidad de Bultos <span class="text-rose-500">*</span></label>
            <input type="number" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-full" placeholder="0.00" />
          </div>
        </div>
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">{{ titleP3() }} <span class="text-rose-500">*</span></label>
            <select
						class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
					>
						<option value="default">Seleccionar...</option>
						<option value="lima">Lima</option>
						<option value="callao">Callao</option>
						<option value="ate">Ate</option>
						<option value="chorrillos">Chorrillos</option>
						<option value="lurin">Lurin</option>
					</select>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">{{ titleAlmacenP3() }}</label>
            <select
						class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
					>
						<option value="default">Seleccionar...</option>
						<option value="dpwc">DPW-Callao</option>
						<option value="ransa">Ransa</option>
						<option value="tpp">TPP</option>
						<option value="unimar">Unimar</option>
						<option value="contrans">Contrans</option>
              <option value="rfs">RFS</option>
              <option value="otro">Otro</option>
					</select>
          </div>
        </div>
        <hr class="mt-4 border-gray-300"/>
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Direccion Cliente o Destino <span class="text-rose-500">*</span></label>
            <textarea class="rounded-md border border-slate-200 px-3 py-1.5 text-sm w-full" rows="2" placeholder="Direccion Cliente o Destino, ubicacion por google maps, etc"></textarea>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Observaciones <span class="text-rose-500">*</span></label>
            <textarea class="rounded-md border border-slate-200 px-3 py-1.5 text-sm w-full" rows="2" placeholder="Ej: Requiere cuadrilla, personal adicional, escolta, permiso MTC, etc."></textarea>
          </div>
        </div>
      </div>

      <div *ngIf="mostrarSolicitante()">
        <div class="mt-4">
          <div class="mb-4 flex items-center justify-between">
            <h3 class="text-sm font-semibold text-slate-700">Datos del Solicitante</h3>
          </div>
        </div>
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Nombres y Apellidos<span class="text-rose-500">*</span></label>
            <input type="text" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-full" placeholder="Nombres y Apellidos" />
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Celular<span class="text-rose-500">*</span></label>
            <input type="text" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-full" placeholder="Celular" />
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Correo<span class="text-rose-500">*</span></label>
            <input type="email" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-full" placeholder="Correo" />
          </div>
          <div>
            <label class="mb-1.0 block text-sm font-medium text-slate-700">RUC<span class="text-rose-500">*</span></label>
            <input type="text" class="rounded-md border border-slate-200 px-3 py-2.5 text-sm w-50 mr-1" placeholder="RUC" />
            <button class="mt-2 rounded-md bg-green-500 px-3 py-2.5 text-sm w-25 font-medium text-white hover:bg-green-600">Validar RUC</button>
          </div>
        </div>
      </div>
      <footer class="mt-6 flex flex-col-reverse gap-3 border-t border-slate-200 pt-4 sm:flex-row sm:items-center sm:justify-end">
        <div class="flex flex-col gap-2 sm:flex-row sm:ml-auto">
          <button type="button" class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500">
            Guardar
          </button>
          <button type="button" class="inline-flex items-center justify-center rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-500">
            Cancelar
          </button>
        </div>
      </footer>
    </form>
  </section>
</section>
