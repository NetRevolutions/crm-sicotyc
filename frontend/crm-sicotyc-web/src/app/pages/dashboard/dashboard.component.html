    <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-[0_1px_2px_rgba(15,23,42,0.04)]">
      <div class="mb-4 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-slate-700">Solicitud de Servicio</h3>
          <!-- <input class="rounded-md border border-slate-200 px-3 py-1.5 text-sm" placeholder="Buscar..." /> -->
      </div>
      <form class="space-y-4">
        <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Tipo de Servicio <span class="text-rose-500">*</span></label>
            <select
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
              (change)="onServiceChange($event)"
            >
              <option value="default" [selected]="selectedService === 'default'">Seleccionar...</option>
              <option value="importacion" [selected]="selectedService === 'importacion'">Importacion</option>
              <option value="exportacion" [selected]="selectedService === 'exportacion'">Exportacion</option>
              <option value="carga-suelta" [selected]="selectedService === 'carga-suelta'">Carga Suelta</option>
            </select>
          </div>

    <!-- Here the types of services will be displayed, with their respective statistics and quick access buttons to create
    new requests or view existing ones. -->
    <ng-container *ngIf="selectedService === 'importacion'">
      <app-importacion></app-importacion>
    </ng-container>

    <ng-container *ngIf="selectedService === 'exportacion'">
      <app-exportacion></app-exportacion>
    </ng-container>

    <ng-container *ngIf="selectedService === 'carga-suelta'">
      <app-carga-suelta></app-carga-suelta>
    </ng-container>

    <div *ngIf="selectedService === 'default'" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm text-slate-600">Seleccione un Tipo de Servicio</p>
    </div>
