	<section class="rounded-lg border border-slate-200 bg-white p-4 shadow-[0_1px_2px_rgba(15,23,42,0.04)]">
    <div class="mb-4 flex items-center justify-between">
      <h3 class="text-sm font-semibold text-slate-700">Datos Generales - Importacion</h3>
    </div>
		<form class="space-y-4">
			<div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">N Solicitud</label>
					<input type="text" value="SOL-2024-006" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring" />
				</div>
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">Fecha Solicitud</label>
					<input type="date" value="2024-07-14" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring" />
				</div>
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">Tipo de Servicio <span class="text-rose-500">*</span></label>
					<select class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring">
						<option>Seleccionar...</option>
						<option>Importacion Maritima</option>
						<option>Importacion Aerea</option>
					</select>
				</div>
			</div>

			<div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">Cliente <span class="text-rose-500">*</span></label>
					<select class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring">
						<option>Seleccionar cliente...</option>
						<option>Ransa Comercial S.A.</option>
						<option>DHL Supply Chain</option>
					</select>
				</div>
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">Agencia Maritima</label>
					<select class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring">
						<option>Seleccionar...</option>
						<option>Cosmos Agencia Maritima</option>
						<option>Neptunia S.A.</option>
					</select>
				</div>
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">N BL / Booking <span class="text-rose-500">*</span></label>
					<input type="text" placeholder="Ej: MAEU123456789" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring" />
				</div>
			</div>

			<div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">Puerto Origen <span class="text-rose-500">*</span></label>
					<select class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring">
						<option>Seleccionar...</option>
						<option>Shanghai, China</option>
						<option>Santos, Brasil</option>
					</select>
				</div>
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">Puerto Destino</label>
					<input type="text" value="Callao, Peru" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring" />
				</div>
				<div>
					<label class="mb-1.5 block text-sm font-medium text-slate-700">ETA (Llegada Estimada)</label>
					<input type="date" value="2024-07-20" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring" />
				</div>
			</div>

			<div>
				<label class="mb-1.5 block text-sm font-medium text-slate-700">Direccion de Entrega <span class="text-rose-500">*</span></label>
				<input type="text" value="Av. Los Libertadores 1245, Ate Vitarte, Lima" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring" />
			</div>

			<div>
				<label class="mb-1.5 block text-sm font-medium text-slate-700">Observaciones</label>
				<textarea rows="3" placeholder="Instrucciones especiales, cuidados especiales de la carga, etc." class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"></textarea>
			</div>
		</form>

	<footer class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-end">

      <button type="button" class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500">
				Guardar
			</button>
			<button type="button" class="inline-flex items-center justify-center rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-500">
				Cancelar
			</button>
