<aside
  class="fixed inset-y-0 left-0 z-30 flex h-screen w-56 flex-col border-r border-slate-700 bg-[#1f2a52] text-slate-100 transition-transform duration-200 lg:static lg:translate-x-0"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <div class="flex h-16 items-center justify-between border-b border-slate-700 px-5">
    <div class="flex items-center">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-500 text-sm font-semibold text-white">SC</div>
      <div class="ml-3">
        <p class="text-sm font-semibold text-white">SICOTYC</p>
        <p class="text-xs text-slate-300">Sistema de Transporte</p>
      </div>
    </div>
    <button type="button" class="rounded-lg p-2 text-slate-300 hover:bg-slate-700 lg:hidden" (click)="onNavigate()" aria-label="Cerrar menu">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="flex flex-1 flex-col overflow-y-auto px-3 py-4">
    <nav class="space-y-1.5">
      @for (section of visibleSections; track section.label) {
        <div>
          <button
            type="button"
            class="flex w-full items-center justify-between rounded-md px-2.5 py-2 text-left text-sm font-medium text-slate-100 transition hover:bg-[#2a3768]"
            (click)="toggleSection(section.label)"
          >
            <span class="flex items-center gap-2">
              @switch (section.icon) {
                @case ('briefcase') {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 14V7a2 2 0 0 0-2-2h-3V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v1H6a2 2 0 0 0-2 2v7m16 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5m16 0H4" /></svg>
                }
                @case ('ship') {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 16s2 2 4 2 4-2 6-2 4 2 6 2 4-2 4-2M6 12h12l-2-6H8l-2 6Z" /></svg>
                }
                @case ('box') {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m3 7 9-4 9 4-9 4-9-4Zm0 0v10l9 4 9-4V7" /></svg>
                }
                @case ('clipboard') {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5h6m-7 3h8m-9 4h10m-2 7H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2.5a2 2 0 0 0 3 0H15a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2Z" /></svg>
                }
                @case ('wrench') {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m14.7 6.3 3 3m-9.4 9.4 9.9-9.9a3 3 0 0 0-4.2-4.2l-9.9 9.9a2 2 0 0 0-.5.9l-1 3.4 3.4-1a2 2 0 0 0 .9-.5Z" /></svg>
                }
                @case ('tool') {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3a1 1 0 0 1 2 0v2.1a7 7 0 0 1 4.9 4.9H20a1 1 0 1 1 0 2h-2.1a7 7 0 0 1-4.9 4.9V19a1 1 0 1 1-2 0v-2.1a7 7 0 0 1-4.9-4.9H4a1 1 0 1 1 0-2h2.1A7 7 0 0 1 11 5.1V3Z" /></svg>
                }
                @case ('chart') {
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 19V5m0 14h16M8 17v-6m4 6V9m4 8v-3" /></svg>
                }
              }
              {{ section.label }}
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300 transition-transform" [class.rotate-180]="isExpanded(section.label)" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
            </svg>
          </button>

          @if (section.children?.length && isExpanded(section.label)) {
            <div class="ml-5 border-l border-slate-600 pl-2">
              @for (child of section.children; track child.path) {
                <a
                  [routerLink]="child.path"
                  routerLinkActive="bg-indigo-500/40 text-white"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="mt-1 flex rounded-md px-2 py-1.5 text-sm text-slate-300 transition hover:bg-[#2a3768] hover:text-white"
                  (click)="onNavigate()"
                >
                  {{ child.label }}
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>

    <div class="mt-auto rounded-xl bg-[#1b2447] p-4">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Sesion</p>
      <p class="mt-1 text-sm font-medium text-white">Juan Perez</p>
      <p class="text-xs text-slate-300">{{ currentRole }}</p>
      <button class="mt-3 flex items-center gap-1 text-xs text-slate-300 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m-6-3h11.25m0 0-3-3m3 3-3 3" />
        </svg>
        Cerrar Sesion
      </button>
    </div>
  </div>
</aside>
