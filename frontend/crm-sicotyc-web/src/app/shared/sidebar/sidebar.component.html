<aside
  class="fixed inset-y-0 left-0 z-30 flex h-screen w-56 flex-col border-r border-slate-700 bg-[#1f2a52] text-slate-100 transition-transform duration-200 lg:static lg:translate-x-0"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <div class="flex h-16 items-center justify-between border-b border-slate-700 px-5">
    <div class="flex items-center">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-500 text-sm font-semibold text-white">SC</div>
      <div class="ml-3">
        <p class="text-sm font-semibold text-white">SICOTYC</p>
        <p class="text-xs text-slate-300">Sistema de Transporte</p>
      </div>
    </div>
    <button type="button" class="rounded-lg p-2 text-slate-300 hover:bg-slate-700 lg:hidden" (click)="onNavigate()" aria-label="Cerrar menu">
      <mat-icon svgIcon="close-sidebar"></mat-icon>
    </button>
  </div>

  <div class="flex flex-1 flex-col overflow-y-auto px-3 py-4">
    <nav class="space-y-1.5">
      @for (section of visibleSections; track section.label) {
        <div>
          <button
            type="button"
            class="flex w-full items-center justify-between rounded-md px-2.5 py-2 text-left text-sm font-medium text-slate-100 transition hover:bg-[#2a3768]"
            (click)="toggleSection(section.label)"
          >
            <span class="flex items-center gap-2">
              <mat-icon svgIcon="{{ section.icon }}" ></mat-icon>
              {{ section.label }}
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300 transition-transform" [class.rotate-180]="isExpanded(section.label)" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
            </svg>
          </button>

          @if (section.children?.length && isExpanded(section.label)) {
            <div class="ml-5 border-l border-slate-600 pl-2">
              @for (child of section.children; track child.path) {
                <a
                  [routerLink]="child.path"
                  routerLinkActive="bg-indigo-500/40 text-white"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="mt-1 flex rounded-md px-2 py-1.5 text-sm text-slate-300 transition hover:bg-[#2a3768] hover:text-white"
                  (click)="onNavigate()"
                >
                  {{ child.label }}
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>

    <div class="mt-auto rounded-xl bg-[#1b2447] p-4">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Sesion</p>
      <p class="mt-1 text-sm font-medium text-white">Juan Perez</p>
      <p class="text-xs text-slate-300">{{ currentRole }}</p>
      <button class="mt-3 flex items-center gap-1 text-xs text-slate-300 hover:text-white">
        <mat-icon svgIcon="close-session"></mat-icon>
        Cerrar Sesion
      </button>
    </div>
  </div>
</aside>
